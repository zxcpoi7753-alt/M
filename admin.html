<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم - حلقات الثريا</title>
    
    <script>
        (function() {
            // التحقق من تسجيل الدخول
            if (sessionStorage.getItem('thuraya_admin_auth') !== 'true') {
                var pass = prompt("🔐 منطقة المشرفين (Admin Area)\nأدخل كلمة المرور للمتابعة:");
                if (pass === '12345') {
                    sessionStorage.setItem('thuraya_admin_auth', 'true');
                } else {
                    // إذا كلمة السر خطأ، ارجع للرئيسية فوراً
                    window.location.href = 'index.html';
                    document.write('<style>body{display:none}</style>'); // إخفاء المحتوى
                }
            }
        })();
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="js/firebase.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 select-none">
    <div id="admin-root">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div style="width: 50px; height: 50px; border: 4px solid #ddd; border-top-color: #059669; border-radius: 50%; animation: spin 1s infinite;"></div>
            <p style="margin-top: 15px; font-family: 'Cairo';">جاري فتح لوحة التحكم...</p>
        </div>
        <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
    </div>
    <script type="text/babel" src="js/admin.js"></script>
</body>
</html>
