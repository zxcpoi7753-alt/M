<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    
    <script>
        // كاشف الأخطاء (للمساعدة في حال حدوث مشكلة)
        window.onerror = function(msg) {
            document.getElementById('debug-info').innerHTML += "<div style='color:red;'>⚠️ " + msg + "</div>";
        };
        // الحماية
        if (sessionStorage.getItem('thuraya_admin_auth') !== 'true') {
            var pass = prompt("كلمة المرور:");
            if (pass === '12345') sessionStorage.setItem('thuraya_admin_auth', 'true');
            else { window.location.href = 'index.html'; throw new Error("Stop"); }
        }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module" src="js/firebase.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">

    <div id="admin-root">
        <div style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
            <div style="font-weight:bold; color:#059669; margin-bottom:10px;">جاري تجهيز النظام...</div>
            <div id="debug-info" style="font-size:12px; font-family:monospace;"></div>
        </div>
    </div>

    <script type="text/babel" src="js/admin.js"></script>

</body>
</html>
