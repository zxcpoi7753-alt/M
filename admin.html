<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم - حلقات الثريا</title>
    
    <script>
        (function() {
            // هل المستخدم سجل دخول مسبقاً؟
            if (sessionStorage.getItem('thuraya_admin_auth') !== 'true') {
                // إيقاف الشاشة فوراً وطلب كلمة المرور
                var pass = prompt("🔐 منطقة المشرفين (Admin Area)\nأدخل كلمة المرور للمتابعة:");
                
                if (pass === '12345') {
                    // كلمة المرور صحيحة
                    sessionStorage.setItem('thuraya_admin_auth', 'true');
                } else {
                    // كلمة المرور خاطئة: طرد فوري للصفحة الرئيسية
                    window.location.href = 'index.html';
                    // إيقاف باقي الصفحة عن التحميل تماماً
                    document.write('<style>body{display:none !important;}</style>'); 
                    throw new Error("Access Denied");
                }
            }
        })();
    </script>

    <link rel="stylesheet" href="css/style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module" src="js/firebase.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 select-none">

    <div id="admin-root">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #059669;">
            <div style="width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #059669; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <p style="margin-top: 15px; font-family: 'Cairo'; font-weight: bold; font-size: 14px;">جاري فتح النظام...</p>
        </div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    </div>

    <script type="text/babel" src="js/admin.js"></script>
</body>
</html>
