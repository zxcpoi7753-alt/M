<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة حلقات الثريا | الإصدار المطور</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="الثريا">
    <link rel="apple-touch-icon" href="img/logo.png">
    <link rel="icon" type="image/png" href="img/logo.png">
    
    <link rel="stylesheet" href="css/style.css">

    <script src="js/tailwindcss.js"></script>
    <script src="js/react.js"></script>
    <script src="js/react-dom.js"></script>
    <script src="js/babel.js"></script>
    <script src="js/html2canvas.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        amiri: ['Amiri', 'serif'],
                    },
                    colors: {
                        emerald: { 50: '#ecfdf5', 100: '#d1fae5', 600: '#059669', 800: '#065f46', 900: '#064e3b' },
                        amber: { 50: '#fffbeb', 100: '#fef3c7', 600: '#d97706' },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 select-none font-cairo">
    
    <div id="debug-error" style="display:none; background: #fee2e2; color: #991b1b; padding: 20px; margin: 20px; border: 2px solid #b91c1c; border-radius: 10px; font-family: sans-serif; direction: ltr; text-align: left; z-index: 9999; position: relative;">
        <h3 style="margin-top:0">🔥 خطأ برمجي (Error Detected):</h3>
        <pre id="debug-msg" style="white-space: pre-wrap; font-size: 12px;"></pre>
        <button onclick="location.reload()" style="background:#b91c1c; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; margin-top:10px; font-weight:bold;">تحديث الصفحة</button>
    </div>

    <script>
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            var container = document.getElementById('debug-error');
            var msgBox = document.getElementById('debug-msg');
            container.style.display = 'block';
            msgBox.innerHTML = "رسالة الخطأ: " + msg + "\nالملف: " + url + "\nالسطر: " + lineNo;
            return false;
        };
    </script>
    <div id="root"></div>

    <script type="module" src="js/firebase.js"></script>
    <script type="text/babel" src="js/data_loader.js"></script>
    <script type="text/babel" src="js/components/ui/CustomModal.js"></script>

    <script type="text/babel" src="js/components/app/HomeSection.js"></script>
    <script type="text/babel" src="js/components/app/TeachersSection.js"></script>
    <script type="text/babel" src="js/components/app/SchedulesSection.js"></script>
    <script type="text/babel" src="js/components/app/AboutSection.js"></script>

    <script type="text/babel" src="js/modules/calculators.js"></script>
    <script type="text/babel" src="js/modules/quran_reader.js"></script>
    <script type="text/babel" src="js/modules/azkar.js"></script>
    <script type="text/babel" src="js/modules/test.js"></script>
    <script type="text/babel" src="js/modules/ui.js"></script>
    <script type="text/babel" src="js/modules/visitors.js"></script>

    <script type="text/babel" src="js/components/extras/VirtuousTimes.js"></script>
    <script type="text/babel" src="js/components/extras/DailyWird.js"></script>
    <script type="text/babel" src="js/components/extras/GlobalCounter.js"></script>
    <script type="text/babel" src="js/components/extras/CardMaker.js"></script>
    <script type="text/babel" src="js/components/extras/QuranExam.js"></script>
    <script type="text/babel" src="js/components/extras/FeelingsPharmacy.js"></script>
    <script type="text/babel" src="js/components/extras/TafseerExam.js"></script>

    <script type="text/babel" src="js/components/seerah/ProphetSeerah.js"></script>
    <script type="text/babel" src="js/components/seerah/AsmaHusna.js"></script>
    <script type="text/babel" src="js/components/seerah/RawdatHub.js"></script>

    <script type="text/babel" src="js/app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('✅ Service Worker Registered!', reg.scope))
                    .catch((err) => console.error('❌ SW Failed:', err));
            });
        }
    </script>

</body>
</html>
